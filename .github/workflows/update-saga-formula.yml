name: Update Saga Formula

on:
  repository_dispatch:
    types: [update-saga-tap]

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update formula
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          sed -i "s|tag: \".*\"|tag: \"${VERSION}\"|" Formula/saga.rb

      - name: Commit and push
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/saga.rb
          git commit -m "Update saga-cli to ${VERSION}"
          git push
